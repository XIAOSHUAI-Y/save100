<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f7f1" /><stop offset="1" stop-color="#bfe8d8" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.92" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a" /><stop offset="1" stop-color="#eda93a" />
    </linearGradient>
    <clipPath id="jarclip"><path d="M31 41q0-5 5-5h28q5 0 5 5v33q0 7-7 7H38q-7 0-7-7z" /></clipPath>
    <style>
      .jar { animation: jingle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 92%; }
      .coins { animation: float 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      .eyes { animation: blink 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      @keyframes jingle { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3%); } }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
    </style>
  </defs>

  <rect width="100" height="100" fill="url(#bg)" />
  <g transform="translate(50 54) scale(1.08) translate(-50 -55)">
    <g class="jar">
      <path d="M30 40q0-6 6-6h28q6 0 6 6v34q0 8-8 8H38q-8 0-8-8z" fill="url(#glass)" />
      <g class="coins" clip-path="url(#jarclip)">
        <circle cx="41" cy="72" r="5.4" fill="url(#coin)" stroke="#d99a2e" stroke-width="0.8" />
        <circle cx="59" cy="73" r="5.4" fill="url(#coin)" stroke="#d99a2e" stroke-width="0.8" />
        <circle cx="50" cy="69" r="5.4" fill="url(#coin)" stroke="#d99a2e" stroke-width="0.8" />
      </g>
      <path d="M30 40q0-6 6-6h28q6 0 6 6v34q0 8-8 8H38q-8 0-8-8z" fill="none" stroke="#a9d8c6" stroke-width="2" />
      <path d="M36 44q0-4 4-4v34q-4 0-4-4z" fill="#fff" opacity="0.8" />
      <rect x="34" y="28" width="32" height="7" rx="3.5" fill="#f4a0b8" />
      <rect x="38" y="33" width="24" height="5" rx="2.5" fill="#fff" opacity="0.85" />
      <g class="eyes">
        <circle cx="43" cy="52" r="2.4" fill="#3f6b5c" />
        <circle cx="57" cy="52" r="2.4" fill="#3f6b5c" />
        <circle cx="43.8" cy="51.2" r="0.8" fill="#fff" />
        <circle cx="57.8" cy="51.2" r="0.8" fill="#fff" />
      </g>
      <path d="M46 58q4 3.4 8 0" stroke="#3f6b5c" stroke-width="2" fill="none" stroke-linecap="round" />
      <ellipse cx="37.5" cy="56" rx="3.4" ry="2" fill="#f4a0b8" opacity="0.7" />
      <ellipse cx="62.5" cy="56" rx="3.4" ry="2" fill="#f4a0b8" opacity="0.7" />
    </g>
  </g>
</svg>
